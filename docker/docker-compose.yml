name: moppings-cafe
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fnb_db
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 admin password123;
      /usr/bin/mc mb myminio/datalake;
      /usr/bin/mc policy set public myminio/datalake;
      exit 0;
      "

  kafka-producer:
    build: 
      context: ..
      dockerfile: docker/Dockerfile.streaming
    command: python data_streaming/kafka_producer.py
    env_file:
      - ../.env
    environment:
      - KAFKA_BROKER=kafka:29092
    depends_on:
      - kafka

  spark-consumer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.streaming
    command: python data_streaming/spark_streaming_consumer.py
    env_file:
      - ../.env
    environment:
      - KAFKA_BROKER=kafka:29092
    depends_on:
      - kafka
      - kafka-producer
    volumes:
      - spark_checkpoints:/app/checkpoints

  spark-batch-job:
    build:
      context: ..
      dockerfile: docker/Dockerfile.streaming
    command: python data_processing/minio_spark_job.py
    env_file:
      - ../.env
    environment:
      - MINIO_ENDPOINT=http://minio:9000
    depends_on:
      - minio

volumes:
  minio_data:
  spark_checkpoints:
